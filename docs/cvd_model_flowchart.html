<div id="controls">
  <button onclick="resetView()">Reset view</button>
  <button onclick="zoomIn()">Zoom +</button>
  <button onclick="zoomOut()">Zoom −</button>
</div>
<div id="hint">Drag to pan · Scroll to zoom</div>

<script>
const wrap = document.getElementById('wrap');
const svg  = document.getElementById('svg-root');

let tx = 0, ty = 0, scale = 0.62;
let dragging = false, ox, oy;

function applyTransform() {
  svg.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}

wrap.addEventListener('mousedown', e => {
  dragging = true;
  ox = e.clientX - tx;
  oy = e.clientY - ty;
  wrap.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  tx = e.clientX - ox;
  ty = e.clientY - oy;
  applyTransform();
});
window.addEventListener('mouseup', () => {
  dragging = false;
  wrap.classList.remove('dragging');
});
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  // Zoom toward cursor
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.12 : 0.89;
  const newScale = Math.min(Math.max(scale * factor, 0.15), 4);
  tx = mx - (mx - tx) * (newScale / scale);
  ty = my - (my - ty) * (newScale / scale);
  scale = newScale;
  applyTransform();
}, { passive: false });

// Touch support
let lastDist = null;
let lastTX, lastTY;
wrap.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    dragging = true;
    ox = e.touches[0].clientX - tx;
    oy = e.touches[0].clientY - ty;
  }
  if (e.touches.length === 2) {
    lastDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });
wrap.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && dragging) {
    tx = e.touches[0].clientX - ox;
    ty = e.touches[0].clientY - oy;
    applyTransform();
  }
  if (e.touches.length === 2) {
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    if (lastDist) {
      scale = Math.min(Math.max(scale * d / lastDist, 0.15), 4);
      applyTransform();
    }
    lastDist = d;
  }
}, { passive: true });
wrap.addEventListener('touchend', () => { dragging = false; lastDist = null; });

function resetView() { tx = 0; ty = 0; scale = 0.62; applyTransform(); }
function zoomIn()    { scale = Math.min(scale * 1.2, 4); applyTransform(); }
function zoomOut()   { scale = Math.max(scale * 0.83, 0.15); applyTransform(); }

applyTransform();
</script>
